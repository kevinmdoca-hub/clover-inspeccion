<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7" id="themeMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clover Inspecciones">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css?v=091">
<title>Clover — Inspecciones</title>
</head>
<body>
<div id="updateBanner" class="update-banner hidden"><div><strong id="updateBannerText">Actualización disponible</strong><div class="small" id="updateBannerSub">Tus datos locales se conservarán.</div><div class="actions"><button id="updateLater" type="button">Más tarde</button><button id="updateNow" type="button" class="brand">Actualizar</button></div></div></div>

<header class="app-topbar">
  <div class="app-brand" aria-label="Clover Inspecciones">
    <span class="app-brandmark" aria-hidden="true"><img src="./brand-mark.png" alt=""></span>
    <div class="app-brand-copy"><strong>Clover</strong><small id="brandSubtitle">Inspecciones</small></div>
  </div>
  <div class="app-top-actions">
    <button id="globalNewBtn" class="iconbtn primary-action" type="button" aria-label="Nueva inspección" title="Nueva inspección">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="settingsBtn" class="iconbtn" type="button" aria-label="Ajustes" title="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21h-4v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3.1 14H3v-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V3h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1v4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </div>
  <span id="saveDot" class="hidden"></span><span id="saveMiniText" class="hidden"></span>
</header>

<main id="workspaceView" class="workspace-shell">
  <section class="workspace-pane" data-workspace-pane="today">
    <div class="pagehead"><div><h1 id="todayTitle">Hoy</h1><p id="todaySub">Trabajo programado y en progreso</p></div><span id="todayCountPill" class="page-pill">0</span></div>
    <div class="summary"><div class="metric"><strong id="metricToday">0</strong><span id="metricTodayLabel">Hoy</span></div><div class="metric"><strong id="metricActive">0</strong><span id="metricActiveLabel">En progreso</span></div><div class="metric"><strong id="metricReady">0</strong><span id="metricReadyLabel">Listas</span></div></div>
    <div id="todayJobs" class="list"></div>
  </section>

  <section class="workspace-pane hidden" data-workspace-pane="work">
    <div class="pagehead"><div><h1 id="workTitle">Trabajo</h1><p id="workSub">Inspecciones locales</p></div><span id="activeWorkBadgePill" class="page-pill">0</span></div>
    <input id="workSearch" class="search" type="search" autocomplete="off" placeholder="Buscar cliente, ubicación o unidad…">
    <div id="workFilters" class="filterchips"><button type="button" class="filtertag active" data-work-filter="active">Activas</button><button type="button" class="filtertag" data-work-filter="ready">Listas</button><button type="button" class="filtertag" data-work-filter="complete">Completadas</button><button type="button" class="filtertag" data-work-filter="all">Todas</button></div>
    <div id="activeJobs" class="list"></div>
  </section>

  <section class="workspace-pane hidden" data-workspace-pane="calendar">
    <div class="pagehead"><div><h1 id="calendarTitle">Calendario</h1><p id="calendarSub">Inspecciones por fecha</p></div></div>
    <div class="calendar-jump"><button id="calendarToday" type="button" class="secondary-sheet compact">Hoy</button><span id="calendarSelectedLabel" class="small"></span></div>
    <section class="calendar-card"><div class="calendar-nav"><button id="calendarPrev" class="cal-nav-btn" type="button" aria-label="Mes anterior">‹</button><div id="calendarDateLabel" class="calendar-month"></div><button id="calendarNext" class="cal-nav-btn" type="button" aria-label="Mes siguiente">›</button></div><div id="calendarWeek" class="calendar-week"></div><div id="calendarGrid" class="calendar-grid"></div></section>
    <h3 id="calendarAgendaHeading" class="agenda-heading"></h3><div id="calendarJobs" class="agenda-list"></div>
  </section>

  <section class="workspace-pane hidden" data-workspace-pane="clients">
    <div class="pagehead"><div><h1 id="clientsTitle">Clientes</h1><p id="clientsSub">Inspecciones y equipos por cliente</p></div></div>
    <div id="clientsList" class="list"></div><div id="clientDetail" class="hidden"></div>
  </section>
</main>

<nav id="workspaceNav" class="bottomnav" aria-label="Navegación principal">
  <button type="button" class="navitem active" data-workspace-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><small id="navToday">Hoy</small></button>
  <button type="button" class="navitem" data-workspace-tab="work"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="m8 9 2 2 5-5M8 15h8"/></svg><small><span id="navWork">Trabajo</span> <span id="activeWorkBadge" class="nav-badge hidden"></span></small></button>
  <button type="button" class="navitem" data-workspace-tab="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><small id="navCalendar">Calendario</small></button>
  <button type="button" class="navitem" data-workspace-tab="clients"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><small id="navClients">Clientes</small></button>
</nav>

<main id="inspectionView" class="inspection-shell hidden">
  <div class="work-mode-bar"><button id="backToWorkspace" type="button" class="work-back">← Trabajo</button><span id="currentInspectionType" class="inspection-type-pill"></span></div>
  <div class="notice" id="pilotNotice"></div>
  <div class="feedback" id="feedbackBox"></div>

  <section class="card">
    <h2 id="sessionHeading"></h2>
    <div class="grid2">
      <div><label id="clientLabel"></label><input id="client" autocomplete="organization"></div>
      <div><label id="locationLabel"></label><input id="location" autocomplete="street-address"></div>
      <div><label id="techLabel"></label><input id="tech" autocomplete="name"></div>
      <div><label id="dateLabel"></label><input id="date" type="date"></div>
      <div style="grid-column:1/-1"><label id="sessionNotesLabel"></label><input id="sessionNotes"></div>
    </div>
  </section>

  <div class="toolbar"><button id="addUnit" type="button" class="add-unit"></button><span id="addUnitHelp" class="small"></span></div>
  <section class="card dashboard"><h2 id="unitsHeading"></h2><div class="fleet-progress"><div class="progress-track"><div id="fleetProgressBar" class="progress-bar"></div></div><div id="fleetProgressCopy" class="progress-copy"></div></div><div id="unitDashboard"></div></section>
  <div id="units"></div>
  <section class="card dashboard dashboard-bottom"><div class="fleet-progress"><div class="progress-track"><div id="fleetProgressBarBottom" class="progress-bar"></div></div><div id="fleetProgressCopyBottom" class="progress-copy"></div></div></section>
  <div class="toolbar"><button id="addUnitBottom" type="button" class="add-unit"></button></div>

  <section id="missingReviewCard" class="card missing"><h2 id="reviewHeading"></h2><div id="missingSummary" class="small"></div><div id="missingGroups"></div></section>
  <section class="card"><h2 id="closeHeading"></h2><div id="sessionFinishStatus" class="small"></div><div class="actions" style="margin-top:10px"><button id="finishSessionBtn" type="button" class="brand"></button></div></section>
  <div id="bottomActionStatus" class="bottom-status"></div>
  <div class="actions"><button id="backupBtn" type="button" class="primary"></button><button id="findingsCsvBtn" type="button"></button><button id="pdfBtn" type="button"></button><button id="clearBtn" type="button" class="danger"></button></div>
</main>
<button id="floatSave" type="button" class="float-save screen"></button>

<div id="sheetBackdrop" class="backdrop hidden"></div>
<section id="sheet" class="sheet hidden" aria-modal="true"></section>
<input id="importFile" type="file" accept=".json,application/json" hidden>

<dialog id="pdfDialog">
  <div class="dialog-head"><h2 id="pdfDialogTitle"></h2></div>
  <div class="dialog-body"><div id="pdfDialogHelp" class="small"></div><div id="pdfUnitOptions"></div><div id="pdfDialogStatus" class="small"></div><div class="dialog-actions"><button id="pdfCancelBtn" type="button"></button><button id="pdfGenerateBtn" type="button" class="brand"></button></div></div>
</dialog>

<dialog id="guidedPhotoDialog" class="guided-dialog">
  <div class="dialog-head"><h2 id="guidedPhotoDialogTitle"></h2><button id="guidedPhotoClose" type="button" aria-label="Cerrar">×</button></div>
  <div class="dialog-body">
    <div id="guidedPhotoProgress" class="guided-progress"></div>
    <div id="guidedPhotoCard" class="guided-card"><div class="guided-meta"><span id="guidedPhotoQid" class="qid"></span><span id="guidedPhotoRequirement"></span></div><h3 id="guidedPhotoTitle"></h3><p id="guidedPhotoHelp"></p><div id="guidedPhotoPreview" class="guided-preview hidden"><img id="guidedPhotoPreviewImg" alt=""></div><label id="guidedPhotoCaptureLabel" class="guided-capture"><span id="guidedPhotoCaptureText"></span><input id="guidedPhotoInput" type="file" accept="image/*"></label><div id="guidedPhotoPending"></div></div>
    <div class="dialog-actions guided-actions"><button id="guidedPhotoSkip" type="button"></button><button id="guidedPhotoRetake" type="button" class="hidden"></button><button id="guidedPhotoUse" type="button" class="brand hidden"></button><button id="guidedPhotoReviewSkipped" type="button" class="hidden"></button><button id="guidedPhotoOptional" type="button" class="brand hidden"></button><button id="guidedPhotoFinish" type="button"></button></div>
  </div>
</dialog>

<!-- Compatibility nodes used by the proven inspection engine; values are surfaced in Settings sheet. -->
<div class="hidden"><h1 id="headerTitle"></h1><p id="headerSub"></p><span id="versionChip"></span><div id="settingsHeading"></div><label id="languageLabel"></label><label id="themeLabel"></label><select id="languageSelect"><option value="es">Español</option><option value="en">English</option></select><select id="themeSelect"><option value="light">Claro</option><option value="dark">Oscuro</option><option value="system">Automático</option></select><div id="saveTitle"></div><div id="saveSub"></div><button id="settingsCloseBtn"></button><button id="persistBtn"></button><button id="importBtn"></button></div>

<script>window.CLOVER_PACKAGE_LANG='es';</script>
<script src="./app.js?v=091"></script>
</body>
</html>
