<title>Clover — Inspection</title>

.steps{margin-top:12px}.step{border:1px solid var(--clover-border);border-radius:15px;overflow:hidden;margin:10px 0;background:var(--clover-input);scroll-margin-top:10px}.step summary{list-style:none;cursor:pointer;background:var(--clover-surface-strong);padding:13px;display:flex;gap:11px;align-items:flex-start}.step summary::-webkit-details-marker{display:none}.num{display:flex;align-items:center;justify-content:center;min-width:42px;height:42px;border-radius:50%;background:var(--clover-dark);color:var(--clover-gold);font-weight:950;border:1px solid #2D3440}.step-title{font-weight:950;font-size:18px;color:var(--clover-dark)}.step-subtitle{display:block;color:var(--clover-text-muted);font-size:12px;margin-top:2px}.step-status{display:block;color:var(--clover-text-muted);font-size:13px;margin-top:4px}.step-status.complete{color:#6B5715;font-weight:850}.step-body{padding:14px;border-top:1px solid var(--clover-border)}
.quick{display:flex;gap:7px;flex-wrap:wrap}.chip{position:relative}.chip input{position:absolute;opacity:0;pointer-events:none}.chip span{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 12px;border:1px solid var(--clover-border);border-radius:999px;background:var(--clover-input);font-size:14px;font-weight:750}.chip input:checked+span{background:#FBEAEC;border-color:var(--clover-coral);color:#963839}

.dashboard .unit-nav{display:block;width:100%;text-align:left;margin:7px 0;background:#FAFAF9}.dashboard .unit-nav:hover{border-color:#9A8A4E}.fleet-progress{margin:8px 0 12px}.progress-track{height:12px;background:#D1D4D8;border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--clover-gold);transition:width .2s ease}.progress-copy{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--clover-text-muted)}
.missing{border-left:5px solid var(--clover-gold)}.missing-unit{border:1px solid var(--clover-border);border-radius:12px;margin:8px 0;background:#FAFAF9;overflow:hidden}.missing-unit>summary{list-style:none;padding:11px 12px;cursor:pointer;font-weight:900}.missing-unit>summary::-webkit-details-marker{display:none}.missing-unit-body{padding:0 12px 12px}.missing-group{padding:9px 0;border-top:1px solid #DFE1E4}.missing-group:first-child{border-top:0}.jump{display:block;width:100%;text-align:left;margin-top:6px}.unit-footer{margin-top:12px;padding-top:12px;border-top:1px solid var(--clover-border);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.unit-progress-copy{font-size:13px;color:var(--clover-text-muted)}.finish-unit{background:var(--clover-dark);color:#fff;border-color:var(--clover-dark)}.finish-unit.ready{background:var(--clover-gold);color:var(--clover-dark-2);border-color:var(--clover-gold)}.finish-unit.finalized{background:var(--clover-green);color:#fff;border-color:var(--clover-green)}
.bottom-status{margin:9px 0;font-size:13px;color:var(--clover-text-muted)}.float-save{position:fixed;z-index:9999;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--clover-green);color:white;box-shadow:0 5px 18px rgba(0,0,0,.16);min-width:0;min-height:38px;padding:7px 11px;font-size:13px;transition:opacity .18s ease,transform .18s ease}.float-save.saving{background:#7A692D}.float-save.error{background:var(--clover-coral)}.float-save.toast-hidden{opacity:0;pointer-events:none;transform:translateY(8px)}

body[data-theme="dark"]{--clover-bg:#181B21;--clover-bg-secondary:#11141A;--clover-surface:#22262D;--clover-surface-strong:#292E36;--clover-input:#171A1F;--clover-border:#454B55;--clover-border-strong:#5A626E;--clover-text:#E7E8EA;--clover-text-bright:#FAFAFA;--clover-text-muted:#A6ABB2;--clover-neutral-soft:#30353D;--clover-green-soft:#1D3423;--clover-monitor-soft:#21372A;--clover-coral-soft:#3A2325;--clover-major-soft:#372126;--shadow:0 8px 24px rgba(0,0,0,.22)}

<body>
<header class="screen"><div class="head"><img src="./icon-192.png" alt="Clover"><div class="head-copy"><h1 id="headerTitle"></h1><p id="headerSub"></p><span id="versionChip" class="version-chip"></span></div><div class="head-tools"><button id="settingsBtn" type="button" class="settings-trigger"><span id="saveDot" class="dot"></span><span id="saveMiniText" class="save-mini-text"></span><span class="gear" aria-hidden="true">⚙</span></button></div></div></header>
<main class="screen">
  <div class="notice" id="pilotNotice"></div>
  <section id="settingsPanel" class="settings-panel hidden"><div class="settings-head"><h2 id="settingsHeading"></h2><button id="settingsCloseBtn" type="button"></button></div><div class="settings-grid"><div><label id="languageLabel" for="languageSelect"></label><select id="languageSelect"><option value="es">Español</option><option value="en">English</option></select></div><div><label id="themeLabel" for="themeSelect"></label><select id="themeSelect"><option value="light">Claro</option><option value="dark">Oscuro</option><option value="system">Automático</option></select></div></div><div class="settings-save" style="margin-top:10px"><span class="dot" aria-hidden="true"></span><div><div id="saveTitle" class="save-title"></div><div id="saveSub" class="small"></div></div></div><div class="actions" style="margin-top:10px"><button id="persistBtn" type="button"></button><button id="importBtn" type="button"></button><input id="importFile" type="file" accept=".json,application/json" hidden></div></section>
  <div class="feedback" id="feedbackBox"></div>

  <section class="card">
    <h2 id="sessionHeading"></h2>
    <div class="grid2">
      <div><label id="clientLabel"></label><input id="client" autocomplete="organization"></div>
      <div><label id="locationLabel"></label><input id="location" autocomplete="street-address"></div>
