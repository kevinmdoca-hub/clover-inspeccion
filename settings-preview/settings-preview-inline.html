 if(action==='back'){go(state.view==='usage-export'?'usage':['password','device','lock','signout'].includes(state.view)?'account':state.view==='management'?'home':'settings');return}
 if(['home','settings','account','preferences','storage','usage','usage-export','about','testing','management','password','device','lock','signout'].includes(action)){go(action);return}
 if(action==='clear-cache'){if(!state.caches[state.app]){toast(t('No sample cache to clear.','No hay caché de ejemplo para borrar.'));return}confirmAction(t('Clear downloaded cache?','¿Borrar caché descargada?'),t('Preview only: remove 8 MB of downloaded cache. Inspection work, photos, pending edits, preferences and account data stay in place.','Solo ejemplo: borrar 8 MB de caché descargada. Se conservan inspecciones, fotos, ediciones pendientes, preferencias y datos de cuenta.'),()=>{state.caches[state.app]=0;render();toast(t('Sample cache cleared. Saved work retained.','Caché de ejemplo borrada. Trabajo guardado conservado.'))});return}
 if(action==='preview-report'){if(!isKevin())return;$('reportJson').value=JSON.stringify(usageReport(),null,2);$('sampleReport').hidden=false;return}
 const messages={save:app().local?t('Save flow shown. No real inspection data was accessed.','Flujo de guardado mostrado. No se accedió a inspecciones reales.'):t('Sync flow shown. This preview has no server connection.','Flujo de sincronización mostrado. Esta vista no tiene conexión al servidor.'),protect:t('In the real app, this requests persistent storage from the browser.','En la app real, se solicita almacenamiento persistente al navegador.'),backup:t('Backup flow preview. No real backup was created.','Vista del respaldo. No se creó un respaldo real.'),restore:t('Restore flow preview: inspect the file, explain replacement scope, then confirm.','Vista de restauración: revisar el archivo, explicar el alcance y confirmar.'),updates:t('Preview version 0.1.1. Live update checks are disabled.','Vista previa 0.1.1. No se buscan actualizaciones reales.'),support:t('Support details include version, device/browser and save/sync status. No passwords or customer notes.','Los detalles incluyen versión, dispositivo/navegador y estado de guardado. Sin contraseñas ni notas de clientes.'),recover:t('Recovery sends a verified account-recovery link. No email is sent by this preview.','La recuperación envía un enlace verificado. Esta vista no envía correos.'),'change-code':t('Proposed flow: current code → new eight-digit code → confirmation.','Flujo propuesto: código actual → nuevo código de ocho dígitos → confirmación.'),'reset-code':t('Proposed flow: verify Clover account → reset this phone’s shared code.','Flujo propuesto: verificar cuenta de Clover → restablecer código compartido del teléfono.'),'save-allocation':t('Sample policy applied in this preview only.','Política de ejemplo aplicada solo en esta vista.')};toast(messages[action]||t('Preview action','Acción de ejemplo'));
});
root.addEventListener('change',event=>{const el=event.target;const map={language:'lang',appearance:'theme',maps:'map',browser:'browser',zone:'zone',manualZone:'manualZone',period:'period',reportUser:'user',appSelect:'app',personaSelect:'persona'};if(!map[el.id])return;state[map[el.id]]=el.value;if(['appSelect','personaSelect'].includes(el.id)){state.view='settings';state.user='all'}const position=$('content').scrollTop;render();$('content').scrollTop=position;$(el.id)?.focus({preventScroll:true})});
root.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('dialog').open&&state.view!=='settings')go('settings')});
render();

})();
</script>
