function settingsPage(){return `<button class="account" data-action="account" aria-label="${t('Open account for','Abrir cuenta de')} ${person()}"><span class="avatar">${esc(person().slice(0,2).toUpperCase())}</span><strong>${person()}</strong><span class="role">${role()}</span><span class="account-link">${t('Manage account','Administrar cuenta')}${icon('chevron')}</span></button>`+section('',row('preferences',t('Preferences','Preferencias'),t('Language, appearance and defaults','Idioma, apariencia y opciones predeterminadas'),'sliders')+row('storage',t('Data & storage','Datos y almacenamiento'),app().local?t('Saved on this device','Guardado en este dispositivo'):t('Sync, pending work and storage','Sincronización, pendientes y almacenamiento'),'storage')+row('about',t('App information','Información de la app'),t('Version, updates and support details','Versión, actualizaciones y detalles de soporte'),'info'))+(isKevin()?section(t('Your tools','Tus herramientas'),row('usage',t('Usage & usability','Uso y usabilidad'),t('Across all users of this app','De todos los usuarios de esta app'),'chart',t('Kevin only','Solo Kevin'))+(app().testing?row('testing',t('Test mode','Modo de prueba'),t('Separate sample work','Trabajo de ejemplo separado'),'flask',t('Kevin only','Solo Kevin')):'')):'')+`<p class="footnote">${t('Preferences apply to your Clover experience. Management tools live in the workspace.','Las preferencias personalizan tu experiencia en Clover. Las herramientas de administración están en el espacio de trabajo.')}</p>`}

function preferencesPage(){return select('language',t('Language','Idioma'),[['en','English'],['es','Español']],state.lang,state.app==='inspections'?t('Controls the app and inspection PDF language.','Controla el idioma de la app y del PDF de inspección.'):'')+select('appearance',t('Appearance','Apariencia'),[['system',t('System','Sistema')],['light',t('Light','Claro')],['dark',t('Dark','Oscuro')]],state.theme)+select('maps',t('Preferred maps','Mapas preferidos'),[['system',t('System default','Predeterminado del sistema')],['google','Google Maps'],['apple','Apple Maps'],['waze','Waze']],state.map,t('Used when opening an address from Clover. Availability depends on the device.','Al abrir una dirección desde Clover. La disponibilidad depende del dispositivo.'))+select('browser',t('Preferred browser','Navegador preferido'),[['system',t('System default','Predeterminado del sistema')],['safari','Safari'],['chrome','Chrome']],state.browser,t('Clover link preference; the phone controls which browsers can open links.','Preferencia para enlaces de Clover; el teléfono determina los navegadores disponibles.'))+(state.app==='routes'?select('zone',t('Time zone','Zona horaria'),[['auto',t('Automatic (device)','Automática (dispositivo)')],['manual',t('Choose manually','Elegir manualmente')]],state.zone)+(state.zone==='manual'?select('manualZone',t('Choose time zone','Elegir zona horaria'),[['America/Mexico_City','Mexico City'],['America/Chicago','Chicago'],['America/New_York','New York'],['America/Los_Angeles','Los Angeles']],state.manualZone):`<div class="notice">${t('Current device zone','Zona actual del dispositivo')}: ${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}</div>`)+`<p class="footnote">${t('Changing the display zone preserves the actual times of scheduled visits.','Cambiar la zona de visualización conserva las horas reales de las visitas programadas.')}</p>`:'')}
function storagePage(){const cached=state.caches[state.app];const used=263+cached;return `<div class="notice">${app().local?t('Local saving only. This app currently has no server sync.','Solo guardado local. Esta app aún no tiene sincronización con servidor.'):t('Sample sync status: 2 changes waiting to upload.','Estado de ejemplo: 2 cambios pendientes de subir.')}</div><div class="stat"><p>${t('Estimated site storage · sample','Almacenamiento estimado del sitio · ejemplo')}</p><h2>${used} <span class="muted" style="font-size:16px;letter-spacing:0">MB / 1 GB</span></h2><div class="storage-track"><div class="storage-fill" style="width:${used/10.24}%"></div></div><div class="legend"><span>${t('Saved work','Trabajo guardado')}: 263 MB</span><span>${t('Cache','Caché')}: ${cached} MB</span></div></div><p class="footnote">${t('Browsers estimate storage for a site. This is not a reading of the phone’s total free space.','El navegador estima el almacenamiento del sitio. No indica el espacio libre total del teléfono.')}</p>`+section(t('Your work','Tu trabajo'),line(t('Pending local changes','Cambios locales pendientes'),String(state.pending))+line(t('Last saved','Último guardado'),t('Just now · sample','Ahora · ejemplo'))+row('save',app().local?t('Save now','Guardar ahora'):t('Sync now','Sincronizar ahora'),'',app().local?'check':'sync'))+section(t('Maintenance','Mantenimiento'),row('clear-cache',t('Clear downloaded cache','Borrar caché descargada'),t('Keeps saved work, photos and preferences','Conserva trabajo guardado, fotos y preferencias'),'storage')+(app().local||state.app==='costs'?row('protect',t('Protect storage','Proteger almacenamiento'),t('Request browser storage protection','Solicitar protección al navegador'),'lock'):''))+(app().backup?section(t('Backup & recovery','Respaldo y recuperación'),row('backup',arr(app().backup),arr(app().backupHelp),'download')+(app().local?row('restore',t('Restore backup','Restaurar respaldo'),t('Review backup before restoring','Revisar respaldo antes de restaurar'),'sync'):'')):'')}
function usagePage(){const scale=(state.period==='30'?3:1)*(state.user==='all'?1:.35);return `<div class="notice gold">${t('Kevin only · all users of','Solo Kevin · todos los usuarios de')} ${arr(app().name)}<br><small>${t('Illustrative metrics, not live reporting.','Métricas ilustrativas, no informes reales.')}</small></div><div class="usage-filters">${select('period',t('Period','Período'),[['7',t('Last 7 days','Últimos 7 días')],['30',t('Last 30 days','Últimos 30 días')]],state.period)}${select('reportUser',t('Users','Usuarios'),[['all',t('All users','Todos los usuarios')],['kevin','Kevin'],['team',app().person]],state.user)}</div><div class="stats-grid">${app().metrics.map(([en,es,value])=>`<div class="stat"><small>${t(en,es)}</small><strong>${typeof value==='number'?Math.max(1,Math.round(value*scale)):value}</strong><small>${t('Sample value','Valor de ejemplo')}</small></div>`).join('')}</div>`+section(t('Where users need more effort','Dónde se requiere más esfuerzo'),app().friction.map(([en,es,n])=>`<div class="chart-row"><div class="chart-label"><span>${t(en,es)}</span><span>${Math.round(n*(state.user==='all'?1:.5))} ${t('events','eventos')}</span></div><div class="chart-track"><i style="width:${n}%"></i></div></div>`).join(''))+`<p class="footnote">${t('Use these patterns to improve the workflow. Each app needs defined events and reporting coverage before these values can be real.','Usa estos patrones para mejorar el flujo de trabajo. Cada app necesita eventos definidos y cobertura de informes antes de mostrar datos reales.')}</p>`}
function aboutPage(){return section('',line(t('App','App'),arr(app().name))+line(t('Preview version','Versión de vista previa'),'0.1.0')+line(t('Data source','Origen de datos'),t('Sample data only','Solo datos de ejemplo'))+line(t('Live connection','Conexión real'),t('None','Ninguna')))+section(t('Support','Soporte'),row('updates',t('Check for updates','Buscar actualizaciones'),'', 'sync')+row('support',t('Support details','Detalles de soporte'),t('App version, save state and environment','Versión, estado de guardado y entorno'),'info'))+`<p class="footnote">${t('This prototype runs independently of the inspection engine, its photos and saved inspections.','Este prototipo funciona separado del motor de inspección, sus fotos y las inspecciones guardadas.')}</p>`}
function testingPage(){return `<div class="notice gold">${t('Kevin-only control. Test work uses a separate sample workspace.','Control exclusivo de Kevin. El trabajo de prueba usa un espacio de ejemplo separado.')}</div>`+section('',`<div class="switch-row"><strong>${t('Test mode','Modo de prueba')}</strong>${toggle('test',state.testing)}</div>`)+`<p class="footnote">${t('Shown only in apps that support a test workflow. This preview never enters a real test or production workspace.','Solo aparece en apps con un flujo de pruebas. Esta vista no accede a un espacio real de pruebas o producción.')}</p>`}
function toggle(name,enabled){return `<div class="toggle" role="group" aria-label="${esc(name==='test'?t('Test mode','Modo de prueba'):t('Receive new prospects: ','Recibir prospectos nuevos: ')+name)}"><button data-toggle="${esc(name)}" data-value="yes" aria-pressed="${enabled}">${t('Yes','Sí')}</button><button data-toggle="${esc(name)}" data-value="no" aria-pressed="${!enabled}">${t('No','No')}</button></div>`}
function managementPage(){return `<div class="notice">${t('Management workspace · sample policy. These switches do not change real assignments.','Espacio de administración · política de ejemplo. Estos controles no cambian asignaciones reales.')}</div>`+section(t('Receive new prospects','Recibir prospectos nuevos'),Object.entries(state.eligibility).map(([name,on])=>`<div class="switch-row"><span><strong>${name}</strong>${name==='Robert'?`<small>${t('Existing assignments retained','Conserva sus asignaciones actuales')}</small>`:''}</span>${toggle(name,on)}</div>`).join(''))+`<p class="footnote">${t('The existing allocator chooses the enabled advisor with the fewest prospects, then uses contactability-based workload to break ties. Enabling someone does not redistribute existing work.','El asignador actual elige al asesor habilitado con menos prospectos y usa la carga según contactabilidad para desempatar. Habilitar a alguien no redistribuye trabajo existente.')}</p><button class="primary" data-action="save-allocation">${t('Apply sample policy','Aplicar política de ejemplo')}</button>`}
function passwordPage(){return `<div class="notice">${t('Account flow preview. No real password is requested or stored.','Vista del flujo de cuenta. No se solicita ni guarda una contraseña real.')}</div><h2 style="font-size:18px">${t('Change password','Cambiar contraseña')}</h2><ol class="flow"><li>${t('Verify your current Clover password.','Verificar tu contraseña actual de Clover.')}</li><li>${t('Enter and confirm the new password.','Escribir y confirmar la nueva contraseña.')}</li><li>${t('Confirm the account update.','Confirmar la actualización de la cuenta.')}</li></ol><button class="secondary" data-action="recover">${t('Forgot password?','¿Olvidaste tu contraseña?')}</button>`}
function devicePage(){return `<div class="notice gold">${t('One eight-digit code for your authorized Clover apps on this phone. Other devices are enrolled separately.','Un código de ocho dígitos para tus apps autorizadas de Clover en este teléfono. Otros dispositivos se registran por separado.')}</div>`+section('',row('change-code',t('Change device code','Cambiar código del dispositivo'),t('Verify the current code, then set a new one','Verificar el código actual y definir uno nuevo'),'lock')+row('reset-code',t('Forgot device code?','¿Olvidaste el código del dispositivo?'),t('Verify your Clover account to reset','Verificar tu cuenta de Clover para restablecer'),'key'))+`<p class="footnote">${t('Shared enrollment, offline updates and reset verification still need implementation. This preview does not change any code.','Falta implementar el registro compartido, las actualizaciones sin conexión y la verificación. Esta vista no cambia ningún código.')}</p>`}
function lockedPage(){return `<div class="welcome">${icon('lock')}<h2>${t('Lock flow preview','Vista del bloqueo')}</h2><p>${t('Lock keeps the session and saved work. Returning requires the device code.','El bloqueo conserva la sesión y el trabajo guardado. Para volver se requiere el código del dispositivo.')}</p><button class="primary" data-action="settings">${t('Return to preview','Volver a la vista previa')}</button></div>`}
function signedOutPage(){return `<div class="welcome">${icon('exit')}<h2>${t('Sign-out flow preview','Vista del cierre de sesión')}</h2><p>${t('Sign out ends the selected app session. Returning requires signing in. Unsent work must be preserved and explained before sign-out.','Cerrar sesión termina la sesión de la app seleccionada. Para volver se debe iniciar sesión. El trabajo no enviado debe conservarse y explicarse antes de cerrar.')}</p><button class="primary" data-action="settings">${t('Return to preview','Volver a la vista previa')}</button></div>`}
function homePage(){return `<div class="welcome"><h2>${arr(app().name)}</h2><p>${t('This is the disconnected Settings design preview. Use the selectors above to compare each app and user view.','Esta es la vista de diseño independiente de Ajustes. Usa los selectores para comparar cada app y tipo de usuario.')}</p><button class="primary" data-action="settings">${t('Open Settings','Abrir Ajustes')}</button>${state.app==='prospects'&&isManager()?`<button class="secondary" data-action="management">${t('Management · Prospect allocation','Administración · Asignación de prospectos')}</button>`:''}</div>`}
function confirmAction(title,copy,onConfirm){$('dialogTitle').textContent=title;$('dialogCopy').textContent=copy;$('dialogCancel').textContent=t('Cancel','Cancelar');$('dialogConfirm').textContent=t('Continue','Continuar');$('dialogConfirm').onclick=()=>{$('dialog').close();onConfirm()};$('dialog').showModal()}
$('dialogCancel').onclick=()=>$('dialog').close();
document.addEventListener('click',event=>{
 const tog=event.target.closest('[data-toggle]');if(tog){if(tog.dataset.toggle==='test'){if(!isKevin())return;state.testing=tog.dataset.value==='yes'}else{if(!isManager()||state.app!=='prospects')return;state.eligibility[tog.dataset.toggle]=tog.dataset.value==='yes'}render();return}
 const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
 if(action==='back'){go(['password','device','lock','signout'].includes(state.view)?'account':state.view==='management'?'home':'settings');return}
 if(['home','settings','account','preferences','storage','usage','about','testing','management','password','device','lock','signout'].includes(action)){go(action);return}
 if(action==='clear-cache'){if(!state.caches[state.app]){toast(t('No sample cache to clear.','No hay caché de ejemplo para borrar.'));return}confirmAction(t('Clear downloaded cache?','¿Borrar caché descargada?'),t('Preview only: remove 8 MB of downloaded cache. Inspection work, photos, pending edits, preferences and account data stay in place.','Solo ejemplo: borrar 8 MB de caché descargada. Se conservan inspecciones, fotos, ediciones pendientes, preferencias y datos de cuenta.'),()=>{state.caches[state.app]=0;render();toast(t('Sample cache cleared. Saved work retained.','Caché de ejemplo borrada. Trabajo guardado conservado.'))});return}
 const messages={save:app().local?t('Save flow shown. No real inspection data was accessed.','Flujo de guardado mostrado. No se accedió a inspecciones reales.'):t('Sync flow shown. This preview has no server connection.','Flujo de sincronización mostrado. Esta vista no tiene conexión al servidor.'),protect:t('In the real app, this requests persistent storage from the browser.','En la app real, se solicita almacenamiento persistente al navegador.'),backup:t('Backup flow preview. No real backup was created.','Vista del respaldo. No se creó un respaldo real.'),restore:t('Restore flow preview: inspect the file, explain replacement scope, then confirm.','Vista de restauración: revisar el archivo, explicar el alcance y confirmar.'),updates:t('Preview version 0.1.0. Live update checks are disabled.','Vista previa 0.1.0. No se buscan actualizaciones reales.'),support:t('Support details include version, device/browser and save/sync status. No passwords or customer notes.','Los detalles incluyen versión, dispositivo/navegador y estado de guardado. Sin contraseñas ni notas de clientes.'),recover:t('Recovery sends a verified account-recovery link. No email is sent by this preview.','La recuperación envía un enlace verificado. Esta vista no envía correos.'),'change-code':t('Proposed flow: current code → new eight-digit code → confirmation.','Flujo propuesto: código actual → nuevo código de ocho dígitos → confirmación.'),'reset-code':t('Proposed flow: verify Clover account → reset this phone’s shared code.','Flujo propuesto: verificar cuenta de Clover → restablecer código compartido del teléfono.'),'save-allocation':t('Sample policy applied in this preview only.','Política de ejemplo aplicada solo en esta vista.')};toast(messages[action]||t('Preview action','Acción de ejemplo'));
});
document.addEventListener('change',event=>{const el=event.target;const map={language:'lang',appearance:'theme',maps:'map',browser:'browser',zone:'zone',manualZone:'manualZone',period:'period',reportUser:'user',appSelect:'app',personaSelect:'persona'};if(!map[el.id])return;state[map[el.id]]=el.value;if(['appSelect','personaSelect'].includes(el.id)){state.view='settings';state.user='all'}const position=$('content').scrollTop;render();$('content').scrollTop=position;$(el.id)?.focus({preventScroll:true})});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('dialog').open&&state.view!=='settings')go('settings')});
render();
</script>
