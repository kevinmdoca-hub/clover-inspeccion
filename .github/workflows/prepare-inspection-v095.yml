name: Prepare Inspection v0.9.5 exact shared component
on:
  push:
    branches: [release/inspection-v095-prepare]
    paths: [.release/header-v095.ready]
permissions:
  contents: write
concurrency:
  group: prepare-inspection-v095
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed patch payload
        run: |
          python3 - <<'PY'
          import base64,hashlib,pathlib,zlib
          encoded=''.join(pathlib.Path('.release/header-v095.part'+i).read_text().strip() for i in ['1','2','2b','3'])
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='0e713e9f8e6de436dd7fd922bd5cf0e9f865afd99190c824a4e80153be5278eb'
          pathlib.Path('/tmp/header-v095.patch').write_bytes(patch)
          PY
      - name: Apply exact component integration to verified base
        run: |
          set -euo pipefail
          git checkout --detach 99ca2f621669cb045570cf740c1db579a5bbb73a
          git apply --check --unidiff-zero /tmp/header-v095.patch
          git apply --unidiff-zero /tmp/header-v095.patch
          node --check app.js
          node --check header-adapter.js
          node --check shared/clover-ui/clover-shell-header.js
          node --check sw.js
          node scripts/verify-header-component.cjs
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          hashes={'app.js':'543d9d37980144a5f2c0720e47a35b523a6f3aa421ae50e19602e1e069f28385','index.html':'606ec5947f74ce62b6d1ac1946f8da652814b803b79e8f009a52a72c17230ae8','sw.js':'162dffbcbe12a651454b938d1643f13537694a7d9baeaa0c9db8cffa723fa561','header-adapter.js':'1cecb55190d294fb1d2790b98c18bcc709d752509807bc69cb8ffa9a0c422a4d','header-integration.css':'eba38f5fdbb1fc6a55a186c16644abc11c43ba1ec3f83394c15dee1c0f1311a2'}
          for path,want in hashes.items():
            assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==want,path
          original=subprocess.check_output(['git','show','HEAD:app.js']).decode()
          current=pathlib.Path('app.js').read_text()
          for start,end in [('function migrateState','function applyTheme'),('window.cloverPrepareUpdate=','initWorkspace().then(')]:
            assert original[original.index(start):original.index(end)]==current[current.index(start):current.index(end)],start
          print('Exact file hashes; inspection, evidence, PDF and update guard unchanged')
          PY
      - name: Commit only reviewed app files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          python3 - <<'PY'
          import subprocess
          allowed={'app.js','index.html','sw.js','shared-header.js','shared-header.css','header-adapter.js','header-integration.css','shared/clover-ui/clover-shell-header.js','shared/clover-ui/manifest.json','shared/clover-ui/README.md','shared/clover-ui/EVENT_CONTRACT.md','README_v0.9.5_DEV.txt','QA_v0.9.5_DEV.txt','scripts/verify-header-component.cjs','docs/handoffs/Clover_UI_Header_v1_0_observations.md'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only','--no-renames']).decode().splitlines())
          assert changed==allowed,(changed-allowed,allowed-changed)
          PY
          git commit -m 'Use exact shared Clover header component v1.0.0 — Inspection v0.9.5 DEV' -m 'Vendor component unchanged at SHA-256 15f2cd0261c2363e61b34fbfc0c9a1c1132cb0d8998f7e132379e32abf24dcaa. Wire only app attributes/events. Preserve existing local records, evidence engine, PDF engine, and update guard. No real QA records or media shipped. Narrow-width canonical issue documented upstream.'
          git push origin HEAD:refs/heads/release/inspection-v0.9.5-dev
          git rev-parse HEAD
