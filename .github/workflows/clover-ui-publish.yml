name: Publish verified Clover UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clover-ui-publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install Pillow==11.3.0
      - name: Fetch and apply immutable shared release
        shell: python
        run: |
          import json, os, subprocess, urllib.request
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'clover-ui-111'; p.mkdir(exist_ok=True)
          base='https://raw.githubusercontent.com/kevinmdoca-hub/clover-inspeccion/115d057f86ac7e7545a9fda9b068bce6b5929b29/shared/clover-ui/releases/1.1.1/'
          for name in ['clover-shell-header.js','clover-shell-header.css','install_release.py']:
            with urllib.request.urlopen(base+name,timeout=30) as r:(p/name).write_bytes(r.read())
          config={'web_root':'.','component':'shared/clover-ui/clover-shell-header.js','icon_blob':'2902d6a283366372d968206d48ca37eb27fe4d5c','icon_full_bleed':True}
          (p/'config.json').write_text(json.dumps(config))
          subprocess.run(['python',str(p/'install_release.py'),str(p/'config.json'),str(p)],check=True)
      - name: Verify Inspection adapter contract
        run: node scripts/verify-header-component.cjs
      - name: Commit generated files without overwriting concurrent work
        run: |
          git config user.name 'Clover Visual Reconciliation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add shared/clover-ui/clover-shell-header.css shared/clover-ui/manifest.json CLOVER_UI_RELEASE_REPORT.json
          if [ -d icons/clover-v111 ]; then git add icons/clover-v111; fi
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ui): publish shared header 1.1.1 and full-bleed Inspection icons'
          git push origin HEAD:main
