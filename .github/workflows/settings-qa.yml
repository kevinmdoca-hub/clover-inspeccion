name: Verify approved Settings 1.0.1
on:
  push:
    branches: [fix/settings-scroll-20261009]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Existing checks and static builds
        shell: bash
        run: |
          case "$GITHUB_REPOSITORY" in
            */clover-inspeccion) node scripts/verify-header-component.cjs ;;
            */clover-location-visual-review) node --test tests/*.test.cjs ;;
            */clover-commercial-workspace) node --check app.js ;;
            */clover-service-pilot) npm test && npm run build ;;
            */clover-cost-pricing-pilot) node --test tests/*.test.mjs ;;
            */clover-market-intelligence) npm test && npm run build ;;
            */clover-routing-field-ops-pilot) npm ci --ignore-scripts && npm test && npm run build ;;
          esac
      - name: Verify installed-app release assets
        run: node tools/verify-settings-release.cjs
      - name: Install isolated browser checker
        timeout-minutes: 4
        run: |
          npm install --prefix "$RUNNER_TEMP/clover-settings-qa" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/clover-settings-qa/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify app Settings, palettes, storage and exports
        run: |
          mkdir -p settings-qa
          NODE_PATH="$RUNNER_TEMP/clover-settings-qa/node_modules" node tools/verify-settings.cjs
          CLOVER_QA_BROWSER=webkit NODE_PATH="$RUNNER_TEMP/clover-settings-qa/node_modules" node tools/verify-settings.cjs
          NODE_PATH="$RUNNER_TEMP/clover-settings-qa/node_modules" node tools/verify-settings-scroll.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: settings-${{ github.event.repository.name }}-${{ github.sha }}
          path: settings-qa/
          if-no-files-found: ignore

